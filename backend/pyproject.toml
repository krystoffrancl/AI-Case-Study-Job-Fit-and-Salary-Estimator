[project]
name = "cv-evaluator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pymupdf",
    "python-docx",
    "python-dotenv",
    "pydantic",
    "langchain",
    "langchain-openai",
    "langchain-chroma",
    "python-multipart>=0.0.27",
    "chromadb>=1.5.9",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_evaluator"]
