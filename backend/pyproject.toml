[project]
name = "cv-evaluator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pymupdf",
    "python-docx",
    "pydantic",
    "pydantic-settings",
    "langchain-core",
    "langchain-openai",
    "langchain-chroma",
    "python-multipart>=0.0.27",
    "chromadb>=1.5.9",
    "numpy",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # řešeno formatterem, dlouhé prompty jsou OK
    "B008",  # FastAPI idiom: `param: T = Depends(...)` / `File(...)` v defaultech
]
