services:
    backend:
        build: ./backend
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - ./backend/data:/app/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 10s
            timeout: 5s
            retries: 3

    frontend:
        build: ./frontend
        ports:
            - "8501:8501"
        env_file:
            - .env
        depends_on:
            backend:
                condition: service_healthy
